# Weatherwise: HAProxy configuration for Lb01
#
# HOW TO USE
#   1. Replace <WEB01_IP> and <WEB02_IP> below with the real server addresses.
#   2. Copy the "frontend" and "backend" sections to the END of
#      /etc/haproxy/haproxy.cfg on Lb01 (keep the existing "global" and
#      "defaults" sections that are already in that file).
#      If Lb01 already has a frontend bound to port 80 from an earlier task,
#      do not add a second one: just point it at "weatherwise_back".
#   3. Check and reload:
#        sudo haproxy -c -f /etc/haproxy/haproxy.cfg
#        sudo service haproxy restart

frontend weatherwise_front
    bind *:80
    mode http
    default_backend weatherwise_back

backend weatherwise_back
    mode http

    # Round robin: request 1 → web-01, request 2 → web-02, request 3 → web-01 …
    balance roundrobin

    # Health check: every 2 s HAProxy requests "/api/health" from each server. A server that
    # fails 3 checks in a row is taken out of rotation, and put back after 2 passes,
    # so visitors never land on a server that is down.
    option httpchk GET /api/health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2

    # Pass the visitor's real IP address on to Nginx (shows up in its access log).
    option forwardfor

    server web-01 <WEB01_IP>:80 check
    server web-02 <WEB02_IP>:80 check
