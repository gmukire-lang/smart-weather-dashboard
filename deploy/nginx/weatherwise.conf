# Weatherwise: Nginx site for Web01 and Web02
# Installed by deploy/deploy.sh to /etc/nginx/sites-available/weatherwise
#
# The application itself is the Express server (server.js) listening on
# 127.0.0.1:3000. Nginx sits in front of it on port 80 and passes requests on.
# Express sets the security headers and the X-Served-By header.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Tell Express who the real visitor is (used for rate limiting and logs).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
}
